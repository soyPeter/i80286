version: "3.9"

networks:
  frontend:
    driver: ${NETWORKS_DRIVER}
  backend:
    driver: ${NETWORKS_DRIVER}

volumes:
  postgres:
    driver: ${VOLUMES_DRIVER}
  redis:
    driver: ${VOLUMES_DRIVER}
  mongo:
    driver: ${VOLUMES_DRIVER}
  # Uncomment the following as needed
  # sonarqube:
  #   driver: ${VOLUMES_DRIVER}
  # elasticsearch:
  #   driver: ${VOLUMES_DRIVER}
  # zookeeper_data:
  #   driver: ${VOLUMES_DRIVER}
  # kafka_data:
  #   driver: ${VOLUMES_DRIVER}

services:

  ### PostgreSQL ###########################################

  postgres:
    container_name: i8086_infra_postgres
    build:
      context: postgres
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
    volumes:
      - ${DATA_PATH_HOST}/postgres:/var/lib/postgresql/data:rw
      - ${POSTGRES_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - backend
    restart: unless-stopped

  ### Redis Container #########################################

  redis:
    container_name: i8086_infra_redis
    build:
      context: redis
      args:
        - REDIS_VERSION=${REDIS_VERSION}
    volumes:
      - ${DATA_PATH_HOST}/redis:/data:rw
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - backend
    restart: unless-stopped

