micronaut.application.name=auth-service
micronaut.config-client.enabled=false
aws.secretsmanager.enabled=true
aws.distributed-configuration.search-active-environments=true
aws.distributed-configuration.search-common-application=false
aws.secretsmanager.fail-fast=true
aws.secretsmanager.cache-secrets=false
aws.secretsmanager.region=eu-west-1
aws.distributed-configuration.prefix=${MICRONAUT_ENVIRONMENTS}-
