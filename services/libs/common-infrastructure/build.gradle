import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
  id 'java-library'
  id 'org.springframework.boot' apply false
  id 'io.spring.dependency-management'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

repositories {
  mavenCentral()
  // Add Spring repositories for Spring Cloud Contract
  maven {
    url 'https://repo.spring.io/release'
    mavenContent {
      releasesOnly()
    }
  }
  maven {
    url 'https://repo.spring.io/milestone'
    mavenContent {
      releasesOnly()
    }
  }
  maven {
    url 'https://repo.spring.io/snapshot'
    mavenContent {
      snapshotsOnly()
    }
  }
  // Add Spring Plugins repository
  maven {
    url 'https://repo.spring.io/plugins-release'
    mavenContent {
      releasesOnly()
    }
  }

  // Add JFrog repository
  maven {
    url 'https://jfrog.bintray.com/jfrog-dependencies'
  }

  // Add repo for resillience4j
  maven {
    url = uri("https://oss.sonatype.org/content/repositories/snapshots")
  }
}

dependencyManagement {
  imports {
    mavenBom SpringBootPlugin.BOM_COORDINATES
    mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2022.0.4'
  }
}

dependencies {
  // Spring Boot Core
  implementation(libs.bundles.spring.boot)

  // Logging
  api 'org.slf4j:slf4j-api'

  // Resilience4j for Circuit Breaker, Retry, Rate Limiting, Bulkhead
  api(libs.bundles.resilience4j)

  // Testing
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

//bootJar {
//    enabled = false
//}

jar {
  enabled = true
}

test {
  useJUnitPlatform()
}
