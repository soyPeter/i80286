import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2022.0.4'
    }
}

dependencies {
    // Spring Boot Core
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Logging
    api 'org.slf4j:slf4j-api'

    // Resilience4j for Circuit Breaker, Retry, Rate Limiting, Bulkhead
    api 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    api 'io.github.resilience4j:resilience4j-spring-boot3'
    api 'io.github.resilience4j:resilience4j-bulkhead'
    api 'io.github.resilience4j:resilience4j-ratelimiter'
    api 'io.github.resilience4j:resilience4j-retry'

    // Common Domain
    api project(':services:libs:common-domain')

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

//bootJar {
//    enabled = false
//}

jar {
    enabled = true
}

test {
    useJUnitPlatform()
}
