import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
  id 'java-library'
  id 'org.springframework.boot' apply false
  id 'io.spring.dependency-management'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

repositories {
  mavenCentral()
  // Add Spring repositories for Spring Cloud Contract
  maven {
    url 'https://repo.spring.io/release'
    mavenContent {
      releasesOnly()
    }
  }
  maven {
    url 'https://repo.spring.io/milestone'
    mavenContent {
      releasesOnly()
    }
  }
  maven {
    url 'https://repo.spring.io/snapshot'
    mavenContent {
      snapshotsOnly()
    }
  }
  // Add Spring Plugins repository
  maven {
    url 'https://repo.spring.io/plugins-release'
    mavenContent {
      releasesOnly()
    }
  }

  // Add JFrog repository
  maven {
    url 'https://jfrog.bintray.com/jfrog-dependencies'
  }

  // Add repo for resillience4j
  maven {
    url = uri("https://oss.sonatype.org/content/repositories/snapshots")
  }
}

dependencyManagement {
  imports {
    mavenBom SpringBootPlugin.BOM_COORDINATES
    mavenBom 'org.testcontainers:testcontainers-bom:1.19.3'
  }
}

dependencies {
  // Spring Boot Core
  implementation(libs.bundles.spring.boot)

  // Logging
  api 'org.slf4j:slf4j-api'

  // TestContainers
  api(libs.bundles.testing)

  // REST Assured
  api 'io.rest-assured:rest-assured'

  // WireMock
  api 'org.wiremock:wiremock:3.3.1'

  // Common Modules
  api project(':services:libs:common-domain')
  api project(':services:libs:common-application')
  api project(':services:libs:common-infrastructure')
}

//bootJar {
//    enabled = false
//}

jar {
  enabled = true
}

test {
  useJUnitPlatform()
}
