plugins {
    id 'java-library'
    id 'org.springframework.boot' apply false
    id 'io.spring.dependency-management'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    // Add Spring repositories for Spring Cloud Contract
    maven { 
        url 'https://repo.spring.io/release' 
        mavenContent {
            releasesOnly()
        }
    }
    maven { 
        url 'https://repo.spring.io/milestone' 
        mavenContent {
            releasesOnly()
        }
    }
    maven { 
        url 'https://repo.spring.io/snapshot' 
        mavenContent {
            snapshotsOnly()
        }
    }
    // Add Spring Plugins repository
    maven { 
        url 'https://repo.spring.io/plugins-release' 
        mavenContent {
            releasesOnly()
        }
    }
    // Add Maven Central with specific URL
    maven {
        url 'https://repo1.maven.org/maven2/'
    }
    // Add JFrog repository
    maven {
        url 'https://jfrog.bintray.com/jfrog-dependencies'
    }

    // Add repo for resillience4j
    maven {
        url = uri("https://oss.sonatype.org/content/repositories/snapshots")
    }
}

dependencyManagement {
    imports {
        mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        // Add Spring Cloud BOM for managing Spring Cloud dependencies
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2022.0.4'
    }
}

dependencies {
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

//bootJar {
//    enabled = false
//}

jar {
    enabled = true
}

test {
    useJUnitPlatform()
}
